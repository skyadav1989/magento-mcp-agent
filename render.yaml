services:
  - type: web
    name: magento-mcp-gateway
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MCP_RESOURCE_URL
        sync: false
      - key: OAUTH_ISSUER_URL
        sync: false
      - key: JWT_AUDIENCE
        sync: false
      - key: JWT_JWKS_URL
        sync: false
      - key: JWT_ALGORITHMS
        value: RS256
      - key: TENANTS_JSON
        sync: false
      - key: REQUIRE_PRODUCT_UPDATE_APPROVAL
        value: 'true'
      - key: MAX_DESCRIPTION_LENGTH
        value: '5000'
      - key: APPROVAL_TTL_SECONDS
        value: '600'
      - key: HTTP_TIMEOUT_SECONDS
        value: '30'
      - key: ALLOWED_HOSTS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
